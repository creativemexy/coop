  <!-- master timeline -->
  <script>
    (function () {
      var tl = gsap.timeline({ paused: true, defaults: { ease: "power2.out" } });
      window.__timelines["composition"] = tl;

      // --- audio-reactive ambient glow: sample pre-extracted frames ---
      var AD = window.AUDIO_DATA;
      if (AD && AD.frames) {
        var FPS = AD.fps || 30;
        var cap = Math.min(AD.frames.length, Math.ceil(25 * FPS));
        var amb = document.getElementById("ambient");
        for (var f = 0; f < cap; f++) {
          tl.call((function (frame) {
            return function () {
              var bass = frame.bands ? (frame.bands[0] + frame.bands[1]) / 2 : 0;
              var r     = frame.rms || 0;
              var s = 1 + bass * 0.16 + r * 0.05;
              var o = 0.34 + r * 0.32;
              amb.style.transform = "scale(" + s.toFixed(4) + ")";
              amb.style.opacity = o.toFixed(4);
            };
          })(AD.frames[f]), [], f / FPS);
        }
      }

      gsap.fromTo("#root > #ambient", { opacity: 0 }, { opacity: 0.5, duration: 1, ease: "none", overwrite: true });
    })();
