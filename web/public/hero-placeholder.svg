  </g>

  <g>
    <rect x="300" y="400" width="200" height="150" rx="16" fill="#ffffff" shadow-color="#000" shadow-opacity="0.2"/>
    <rect x="320" y="424" width="160" height="14" rx="7" fill="#1e293b" opacity="0.85"/>
    <rect x="320" y="448" width="120" height="10" rx="5" fill="#64748b" opacity="0.4"/>
    <rect x="320" y="484" width="120" height="24" rx="12" fill="#2563eb"/>
    <rect x="456" y="484" width="24" height="24" rx="12" fill="#7c3aed"/>
